name: Build Android APK

on:
  push:
    branches: [ "main", "master", "vxp" ]
  pull_request:
    branches: [ "main", "master", "vxp" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install Android SDK 28 and NDK r17c
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-28" "build-tools;28.0.3" "ndk;17.2.4988734"

      - name: Create local.properties
        working-directory: VirtualApp
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/17.2.4988734" >> local.properties

      - name: Grant execute permission for gradlew
        working-directory: VirtualApp
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        working-directory: VirtualApp
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: VirtualApp/app/build/outputs/apk/**/*.apk
